<!doctype html>
<html lang="pt-BR"><head><base target="_top"><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#F2F4F1;--card:#fff;--fg:#17201B;--mut:#5E6B63;--line:#DCE2DD;--brand:#8E2A1F;--brand-fg:#fff;--ok:#2E8B57;--bad:#C2452D;--na:#8A948E;--fd:"Bricolage Grotesque",Georgia,sans-serif;--fb:"Figtree",system-ui,sans-serif;--fm:"JetBrains Mono",monospace}
@media(prefers-color-scheme:dark){:root{--bg:#121512;--card:#1B201C;--fg:#E8EEE9;--mut:#93A198;--line:#2C352F;--brand:#E0796B;--brand-fg:#121512;--ok:#5CC98A;--bad:#F07A62;--na:#7B877F;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--fb);padding:0 max(16px,env(safe-area-inset-right)) 90px max(16px,env(safe-area-inset-left))}
main{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{padding:22px 0 4px}h1{font:800 28px/1.05 var(--fd);margin:0}h2{font:700 19px/1.2 var(--fd);margin:0}
.eb{font:500 11px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
button{font:600 14px var(--fb);border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:10px 14px;cursor:pointer}
.pri{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1;min-width:0}.meta{color:var(--mut);font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 16px calc(6px + env(safe-area-inset-bottom))}
.tabs button{border:0;background:none;color:var(--mut)}.tabs button[aria-current=true]{color:var(--brand)}
.it{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}.it:first-of-type{border-top:0;padding-top:0}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px 4px}
.seg [aria-pressed=true][data-v=c]{background:var(--ok);border-color:var(--ok);color:#fff}.seg [aria-pressed=true][data-v=nc]{background:var(--bad);border-color:var(--bad);color:#fff}.seg [aria-pressed=true][data-v=na]{background:var(--na);border-color:var(--na);color:#fff}
details summary{cursor:pointer;color:var(--mut);font-size:13px}.como{font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:6px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
.pill{font:500 11px var(--fm);padding:3px 8px;border-radius:99px;border:1px solid currentColor}.ok{color:var(--ok)}.bad{color:var(--bad)}
.g3{display:grid;grid-template-columns:1fr 1fr;gap:8px}.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px}
.sec{display:flex;justify-content:space-between;gap:10px;font-size:14px}
a{color:var(--brand)}
</style></head><body><main id="app"><p class="meta" style="padding-top:40px">Carregando…</p></main>
<nav class="tabs"><button data-t="nova">Nova visita</button><button data-t="manual">Manual</button><button data-t="hist">Histórico</button></nav>
<script>
const EMAIL="<?= email ?>";
const ROTEIRO=[
 {id:"seg",nome:"Segurança e EPI",itens:[
  ["EPI completo na operação","Observe 10 pessoas no pátio: luva, bota com biqueira e óculos no corte e na pregação. Uma pessoa sem EPI já é não conformidade."],
  ["Circulação de empilhadeira sinalizada","Faixa de pedestre pintada, espelho nas esquinas e velocidade controlada. Fique 5 minutos num cruzamento."],
  ["Pilhas dentro da altura máxima","Pilha de palete vazio no limite definido pelo centro (referência comum: 2,5 m ou 15 a 18 unidades), prumada e sem palete quebrado na base."],
  ["Extintores e rotas de fuga livres","Extintor no lugar, com lacre e validade em dia, e nenhuma pilha bloqueando porta ou rota."]]},
 {id:"rec",nome:"Recebimento e triagem",itens:[
  ["Retorno conferido contra a ordem de coleta","Pegue a última coleta recebida e compare quantidade física, nota e sistema. Diferença sem registro é não conformidade."],
  ["Triagem feita no dia","Não pode haver palete de retorno parado sem classificação há mais de 24h. Pergunte a data da carga mais antiga no pátio."],
  ["Paletes de terceiros segregados","Palete que não é do pool, de outra cor ou outro dono, fica em área separada e identificada para devolução."],
  ["Avarias registradas com foto","Carga que chega muito danificada tem foto e registro para cobrança do cliente."]]},
 {id:"insp",nome:"Inspeção e classificação",itens:[
  ["Critério de inspeção visível no posto","O padrão (bom, reparo, sucata) com fotos de exemplo fica afixado onde o inspetor trabalha."],
  ["Amostra de 10 paletes classificados certo","Pegue 10 paletes da pilha de bons e confira: tábua rachada, prego saliente, bloco solto ou contaminação reprovam."],
  ["Palete contaminado isolado","Óleo, química ou mofo vai para área de quarentena com descarte ou limpeza registrados."],
  ["Taxa de reparo acompanhada","O centro sabe dizer o percentual de bons, reparo e sucata da última semana."]]},
 {id:"rep",nome:"Reparo e tratamento térmico",itens:[
  ["Reparo dentro do padrão do pool","Peça de reposição na mesma medida e espessura, pregação no padrão e marca da cor do pool refeita."],
  ["Tratamento térmico com registro","Cada lote HT tem registro de tempo e temperatura conforme ISPM-15 e marcação IPPC legível no palete."],
  ["Madeira de reposição rastreável","Lote de madeira com origem identificada (fornecedor homologado, reflorestamento)."],
  ["Fila de reparo sob controle","Paletes aguardando reparo em quantidade compatível com a capacidade de 1 a 2 dias."]]},
 {id:"est",nome:"Estoque e inventário",itens:[
  ["Contagem física bate com o sistema","Conte uma área e compare com o saldo do sistema. Aceitável até 1% de diferença no próprio centro."],
  ["Inventário cíclico em dia","Veja a data da última contagem completa e do último cíclico. Calendário atrasado é não conformidade."],
  ["Estoque separado por status","Bons, reparo, sucata e terceiros em áreas demarcadas e identificadas."],
  ["Cobertura de estoque para abastecimento","Paletes bons disponíveis cobrem a demanda prevista dos próximos dias de entrega."]]},
 {id:"exp",nome:"Expedição e abastecimento",itens:[
  ["Pedido de abastecimento conferido na carga","Quantidade carregada igual à ordem, com conferência registrada antes de o caminhão sair."],
  ["Veículo vistoriado","Baú limpo, seco e sem pregos expostos antes de carregar."],
  ["Documentos emitidos corretamente","Nota e ordem com cliente, quantidade e tipo de palete batendo."],
  ["Coletas da semana no prazo","Compare as coletas agendadas com as realizadas. Coleta atrasada sem justificativa é não conformidade."]]},
 {id:"5s",nome:"Organização e 5S",itens:[
  ["Pátio limpo e sem sucata espalhada","Sem pedaço de madeira, prego ou cinta no chão das áreas de circulação."],
  ["Ferramentas no lugar","Pregadeiras, serras e compressor guardados e com manutenção identificada."],
  ["Gestão à vista atualizada","Quadro com indicadores da semana e plano de ação da última visita."]]},
 {id:"ind",nome:"Gestão e indicadores",itens:[
  ["Plano de ação da visita anterior concluído","Abra as ações da última visita e verifique cada uma no local."],
  ["Indicadores do mês apresentados","Giro do pool, perdas, tempo de triagem, taxa de reparo e coletas no prazo."],
  ["Equipe treinada no padrão","Pergunte a 2 pessoas qual o critério de reprovação de um palete. As respostas têm de bater com o padrão."]]}
].map(s=>({...s,itens:s.itens.map(([txt,como],i)=>({id:s.id+i,txt,como}))}));
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D={centros:[],visitas:[],acoes:[]},tab="nova",V=null,msg="";
const run=(fn,...a)=>new Promise((ok,err)=>google.script.run.withSuccessHandler(ok).withFailureHandler(err)[fn](...a));
async function load(){try{D=JSON.parse(await run("carregar"))}catch(e){msg="Não consegui ler a planilha: "+e.message}render()}
function nova(){V={centro:D.centros[0]?.nome||"",visitante:EMAIL,data:new Date().toLocaleDateString("pt-BR"),resp:{},fotos:{},obsGeral:"",copia:""}}
function notaSec(s){const v=s.itens.map(i=>V.resp[i.id]?.v).filter(x=>x==="c"||x==="nc");return{nota:v.length?Math.round(100*v.filter(x=>x==="c").length/v.length):null,nc:v.filter(x=>x==="nc").length}}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
function render(){
 document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.t===tab));
 const a=$("#app");const head=`<header><div class="eb">Centros de serviço · pool de paletes</div><h1>Rota Visitas</h1></header>`+(msg?`<div class="card"><b>${msg}</b></div>`:"");
 if(tab==="manual"){a.innerHTML=head+`<div class="card"><h2>Manual de visita</h2><p class="meta">Para cada item: o que olhar e quando marcar não conforme. Uma visita completa leva de 2 a 3 horas. Comece pela segurança, siga o fluxo do palete (recebimento, inspeção, reparo, estoque, expedição) e feche com a gestão do centro.</p></div>`+ROTEIRO.map(s=>`<div class="card"><h2>${s.nome}</h2>${s.itens.map(i=>`<div class="it"><b>${esc(i.txt)}</b><div class="meta">${esc(i.como)}</div></div>`).join("")}</div>`).join("");return}
 if(tab==="hist"){a.innerHTML=head+`<div class="card"><h2>Ações em aberto</h2>${D.acoes.length?D.acoes.map(x=>`<label class="row"><input type="checkbox" data-ac="${x.id}" style="width:auto"><span class="sp"><b>${esc(x.centro)}</b> · ${esc(x.txt||x.item)}<br><span class="meta">${esc(x.resp||"Sem responsável")}${x.prazo?" · até "+x.prazo:""}</span></span></label>`).join(""):`<p class="meta">Nenhuma ação em aberto.</p>`}</div><div class="card"><h2>Visitas</h2>${D.visitas.length?D.visitas.map(v=>`<div class="sec"><span class="sp"><b>${esc(v.centro)}</b><br><span class="meta">${v.data} · ${esc(v.visitante)} · ${v.nc} NC</span></span><span><span class="pill ${v.nota>=85?"ok":"bad"}">${v.nota}%</span> <a href="${v.pdf}">PDF</a></span></div>`).join(""):`<p class="meta">Nenhuma visita registrada ainda.</p>`}${D.planilha?`<a href="${D.planilha}">Abrir planilha base</a>`:""}</div>`;
  a.querySelectorAll("[data-ac]").forEach(c=>c.onchange=async()=>{c.disabled=true;await run("concluirAcao",c.dataset.ac);D.acoes=D.acoes.filter(x=>x.id!==c.dataset.ac);render()});return}
 if(!V)nova();
 const tot=ROTEIRO.flatMap(s=>s.itens).length,resp=Object.values(V.resp).filter(r=>r.v).length;
 a.innerHTML=head+`<div class="card"><div class="g3"><div><label class="eb" for="cen">Centro</label><select id="cen">${D.centros.map(c=>`<option ${c.nome===V.centro?"selected":""}>${esc(c.nome)}</option>`).join("")}</select></div><div><label class="eb" for="vis">Visitante</label><input id="vis" value="${esc(V.visitante)}"></div></div>
 <div class="row"><span class="meta sp">${resp} de ${tot} itens avaliados</span><span class="meta">${Math.round(100*resp/tot)}%</span></div><div class="bar"><i style="width:${100*resp/tot}%"></i></div></div>`+
 ROTEIRO.map(s=>{const n=notaSec(s);return `<div class="card"><div class="row"><h2 class="sp">${s.nome}</h2>${n.nota!=null?`<span class="pill ${n.nota>=85?"ok":"bad"}">${n.nota}%</span>`:""}</div>${s.itens.map(i=>{const r=V.resp[i.id]||{};return `<div class="it"><b>${esc(i.txt)}</b><details><summary>Como verificar</summary><div class="como">${esc(i.como)}</div></details>
 <div class="seg">${[["c","Conforme"],["nc","Não conf."],["na","N/A"]].map(([v,l])=>`<button data-i="${i.id}" data-v="${v}" aria-pressed="${r.v===v}">${l}</button>`).join("")}</div>
 ${r.v==="nc"?`<input data-o="${i.id}" placeholder="O que corrigir" value="${esc(r.obs||"")}"><div class="g3"><input data-r="${i.id}" placeholder="Responsável" value="${esc(r.resp||"")}"><input type="date" data-p="${i.id}" value="${esc(r.prazo||"")}"></div>`:""}
 <div class="row">${V.fotos[i.id]?`<img class="thumb" src="data:image/jpeg;base64,${V.fotos[i.id]}" alt="Foto do item">`:""}<input type="file" accept="image/*" capture="environment" data-f="${i.id}" style="width:auto;flex:1"></div></div>`}).join("")}</div>`}).join("")+
 `<div class="card"><label class="eb" for="og">Observações gerais</label><textarea id="og" rows="3">${esc(V.obsGeral)}</textarea><label class="eb" for="cp">Enviar cópia do relatório para (opcional)</label><input id="cp" type="email" value="${esc(V.copia)}" placeholder="email@empresa.com"></div>
 <button class="pri" id="fim">Concluir e gerar relatório</button><p class="meta" id="st"></p>`;
 $("#cen").onchange=e=>V.centro=e.target.value;$("#vis").oninput=e=>V.visitante=e.target.value;$("#og").oninput=e=>V.obsGeral=e.target.value;$("#cp").oninput=e=>V.copia=e.target.value;
 a.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{V.resp[b.dataset.i]={...V.resp[b.dataset.i],v:b.dataset.v};const y=scrollY;render();scrollTo(0,y)});
 a.querySelectorAll("[data-o]").forEach(x=>x.oninput=()=>V.resp[x.dataset.o].obs=x.value);
 a.querySelectorAll("[data-r]").forEach(x=>x.oninput=()=>V.resp[x.dataset.r].resp=x.value);
 a.querySelectorAll("[data-p]").forEach(x=>x.onchange=()=>V.resp[x.dataset.p].prazo=x.value);
 a.querySelectorAll("[data-f]").forEach(x=>x.onchange=()=>{const f=x.files[0];if(!f)return;const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,900/img.width);c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);V.fotos[x.dataset.f]=c.toDataURL("image/jpeg",.6).split(",")[1];const y=scrollY;render();scrollTo(0,y)};img.src=URL.createObjectURL(f)});
 $("#fim").onclick=async()=>{const secoes=ROTEIRO.map(s=>({nome:s.nome,...notaSec(s),itens:s.itens.map(i=>({id:i.id,txt:i.txt,...(V.resp[i.id]||{})}))}));
  const all=Object.values(V.resp).filter(r=>r.v==="c"||r.v==="nc");if(!all.length){$("#st").textContent="Avalie ao menos um item antes de concluir.";return}
  const nota=Math.round(100*all.filter(r=>r.v==="c").length/all.length);
  const nc=ROTEIRO.flatMap(s=>s.itens.filter(i=>V.resp[i.id]?.v==="nc").map(i=>({item:i.txt,...V.resp[i.id]})));
  $("#fim").disabled=true;$("#st").textContent="Gerando relatório em PDF e enviando por e-mail…";
  try{const r=JSON.parse(await run("salvarVisita",JSON.stringify({centro:V.centro,visitante:V.visitante,data:V.data,nota,nc,secoes,fotos:V.fotos,obsGeral:V.obsGeral,copia:V.copia})));
   V=null;msg=`Visita salva. <a href="${r.pdf}">Abrir relatório em PDF</a>`;tab="hist";await load()}
  catch(e){$("#fim").disabled=false;$("#st").textContent="Não salvou: "+e.message}};
}
load();
</script></body></html>
