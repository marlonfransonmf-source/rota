 {id:"e1",tpl:"t1",nome:"Abertura do hub",autor:"Exemplo",ts:Date.now()-864e5,ex:1,resp:{a:{v:"c"},b:{v:"nc",obs:"Checklist do turno não preenchido"},c:{v:"22"},d:{v:"c"}},acoes:[{id:"x1",txt:"Checklist do turno não preenchido",dono:"Líder do turno",feito:false}]},
 {id:"e2",tpl:"t2",nome:"Vistoria de veículo",autor:"Exemplo",ts:Date.now()-2*864e5,ex:1,resp:{a:{v:"c"},b:{v:"c"},c:{v:"ABC1D23"}},acoes:[]}]};

const F=new Map();let idb=null;

const CICLO={CD:7,Cliente:30,Transportador:15,Reparo:30};
function poolCalc(){const P=S.pool;return P.locais.map(l=>{
 const mv=P.movs.filter(m=>m.local===l.id);const saldo=mv.reduce((a,m)=>a+(m.tipo==="envio"?m.qtd:-m.qtd),0);
 const perdas=mv.filter(m=>m.tipo==="perda").reduce((a,m)=>a+m.qtd,0);
 const c=P.contagens.filter(x=>x.local===l.id).sort((a,b)=>b.ts-a.ts)[0];
 const saldoNaContagem=c?mv.filter(m=>m.ts<=c.ts).reduce((a,m)=>a+(m.tipo==="envio"?m.qtd:-m.qtd),0):null;
 const div=c?c.qtd-saldoNaContagem:null;const divPct=c&&saldoNaContagem?Math.round(1000*div/saldoNaContagem)/10:null;
 const dias=c?Math.floor((Date.now()-c.ts)/864e5):null;const ciclo=CICLO[l.tipo]||30;
 const prio=Math.round((saldo/50)+(Math.abs(divPct||0)*2)+(dias==null?40:Math.max(0,dias-ciclo)));
 return{...l,saldo,perdas,ult:c,div,divPct,dias,ciclo,vencida:dias==null||dias>ciclo,prio}}).sort((a,b)=>b.prio-a.prio)}

 <div class="card"><div class="row"><h2 class="sp">Coletas agendadas</h2><span class="meta">${insp.tot?`Inspeção dos retornos: ${insp.pb}% bons · ${insp.pr}% reparo · ${insp.ps}% sucata`:""}</span></div>${S.pool.coletas.filter(c=>!c.ok).sort((a,b)=>a.data.localeCompare(b.data)).map(c=>`<label class="row"><input type="checkbox" id="co-${c.id}" data-co="${c.id}" style="width:auto"><span class="sp"><b>${esc((S.pool.locais.find(l=>l.id===c.local)||{}).nome||"")}</b><br><span class="meta">${c.data.split("-").reverse().join("/")} · ${c.qtd} paletes</span></span></label>`).join("")||`<p class="meta">Nenhuma coleta pendente.</p>`}
 <div class="f3"><select id="co-l">${opt}</select><input id="co-d" type="date"><input id="co-q" type="number" inputmode="numeric" placeholder="Qtd"></div><button id="co-ok">Agendar coleta</button><p class="meta">Marcar a coleta como feita já lança o retorno no saldo.</p></div>

function regras(L){const out=[];L.filter(l=>l.vencida).slice(0,3).forEach(l=>out.push(`Contar <b>${esc(l.nome)}</b>: ${l.ult?`última contagem há ${l.dias} dias, ciclo de ${l.ciclo}`:"nunca contado"}, saldo de ${l.saldo} paletes.`));
 L.filter(l=>(l.divPct||0)<-3).forEach(l=>out.push(`Divergência em <b>${esc(l.nome)}</b>: faltam ${-l.div} paletes (${l.divPct}%). Abrir cobrança ou reconciliação de movimentos.`));
 L.filter(l=>l.tipo==="Cliente"&&l.saldo>200).forEach(l=>out.push(`<b>${esc(l.nome)}</b> segura ${l.saldo} paletes. Agendar coleta de retorno.`));
 return `<p class="meta">Análise por regras (IA indisponível nesta visualização).</p><ul>${out.map(x=>`<li>${x}</li>`).join("")||"<li>Pool equilibrado.</li>"}</ul>`}

 const s=sampleP?await sampleP:null;

 const dados=L.map(l=>({local:l.nome,tipo:l.tipo,saldo_contabil:l.saldo,perdas:l.perdas,dias_desde_contagem:l.dias,ciclo_dias:l.ciclo,divergencia:l.div,divergencia_pct:l.divPct}));

  iaOut=`<p>${esc(r.resumo)}</p><ul>${(r.acoes||[]).map(x=>`<li><span class="pill ${x.prioridade==="alta"?"bad":"ok"}">${esc(x.prioridade)}</span> <b>${esc(x.local)}</b>: ${esc(x.acao)} <span class="meta">${esc(x.porque)}</span></li>`).join("")}</ul><p class="meta">Risco de perda: ${esc(r.risco_perda)}</p>`}
 catch(e){iaOut=regras(L)}

function grupos(t){const g=[];t.itens.forEach(i=>{const s=i.sec||"";if(!g.length||g[g.length-1].sec!==s)g.push({sec:s,itens:[]});g[g.length-1].itens.push(i)});return g}
const PESOS=[1,2,3,5],PONTUA=["sn","esc","opc","num"];
const TIPOS=[["sn","Conforme / Não conforme"],["esc","Nota de 1 a 5"],["opc","Múltipla escolha com pontos"],["num","Número ou contagem com faixa"],["txt","Texto livre"],["foto","Foto"],["ass","Assinatura"]];
function frac(i,r){if(!r||r.v==null||r.v==="")return null;const v=r.v;
 if(i.tipo==="sn")return v==="c"?1:v==="nc"?0:null;
 if(i.tipo==="esc")return(+v-1)/4;
 if(i.tipo==="opc"){const o=(i.opcoes||[]).find(o=>o.t===v);return o?o.p/100:null}
 if(i.tipo==="num"){if(i.min==null&&i.max==null)return null;const n=+v;return(i.min==null||n>=i.min)&&(i.max==null||n<=i.max)?1:0}
 return null}
const falha=(i,r)=>{const f=frac(i,r);return f!=null&&f<.5};
function nota(itens,resp){let s=0,w=0,nc=0;const crit=[];itens.forEach(i=>{const f=frac(i,resp[i.id]);if(f==null)return;const p=+i.peso||1;s+=p*f;w+=p;if(f<.5){nc++;if(i.critico)crit.push(i)}});
 const b=w?Math.round(100*s/w):null;return{nota:b==null?null:crit.length?0:b,bruta:b,nc,crit}}
function score(x){const t=S.templates.find(t=>t.id===x.tpl);return t?nota(t.itens,x.resp).nota:null}
function resumoPont(t){const p=t.itens.filter(i=>PONTUA.includes(i.tipo)),c=t.itens.filter(i=>i.critico).length,w=p.some(i=>(+i.peso||1)>1);return `${p.length} pontuam${w?" com peso":""}${c?` · ${c} críticos`:""}`}

const SEGN={pal:"Paletes",alim:"Alimentos",loja:"Loja",veic:"Frota",arm:"Operação"},OBJN={aud:"Auditoria",turno:"Rotina de turno",seg:"Segurança",qual:"Qualidade",inv:"Inventário",veic:"Vistoria de veículo"};
function segmento(br){const b=(br||"").toLowerCase();
 return /palet|pallet|pbr|chep|\bgee\b/.test(b)?"pal":/aliment|restaurant|cozinha|padaria|lanchonete|refeiç|food/.test(b)?"alim":/loja|varejo|supermerc|mercado|vitrine|g[ôo]ndola|atendimento/.test(b)?"loja":/ve[íi]cul|frota|caminh|motorist|\bvan\b/.test(b)?"veic":"arm"}
function secoesDe(k){if(k==="pal")return ROTEIRO.map(([sec,it])=>({sec,itens:it.map(([txt,como,peso,crit])=>[txt,como,peso||1,crit?1:0,""])}));const b=BANCO[k];return b?[{sec:b[0],itens:b[1]}]:[]}
function gerarLocal(w){const s=segmento(w.br),o=w.obj,N=+w.tam;
 const plano={aud:s==="pal"?["pal"]:["seg",s,"ges"],turno:["seg",s==="pal"?"arm":s],seg:["seg",s==="pal"?"arm":s],qual:["qual",s],inv:["inv",s==="pal"?"arm":s],veic:["veic","seg"]}[o]||["seg",s];
 const secs=[...new Set(plano)].flatMap(secoesDe);
 /* escolhe por rodadas: o item de maior risco de cada seção primeiro, até o tamanho pedido */
 const fila=secs.map(x=>x.itens.map((it,k)=>({it,k})).sort((a,b)=>b.it[2]-a.it[2]));const pega=secs.map(()=>new Set());let n=0;
 for(let r=0;n<N&&fila.some(f=>f.length>r);r++)fila.forEach((f,j)=>{if(n<N&&f[r]){pega[j].add(f[r].k);n++}});
 const itens=[];secs.forEach((x,j)=>x.itens.forEach((it,k)=>{if(!pega[j].has(k))return;const[txt,como,risco,crit,acao,tipoB,extra]=it;let tipo=tipoB||"sn";const pontua=PONTUA.includes(tipo)||!tipoB;
  const i={id:uid(),txt,tipo,sec:x.sec,como,acao:acao||"",peso:1,critico:false,fotoNC:false};
  if(tipo==="num"&&extra){i.min=extra.min;i.max=extra.max}
  if(pontua){
   if(w.pont==="bin"){if(i.tipo!=="num"||!extra)i.tipo="sn";if(i.tipo==="sn"){delete i.min;delete i.max}}
   else{i.peso=[1,1,2,3][risco]||1;i.critico=!!crit;i.fotoNC=risco>=3;
    if(w.pont==="peso"&&i.tipo==="esc")i.tipo="sn";
    if(w.pont==="esc"&&!crit&&i.tipo==="sn")i.tipo="esc"}}
  itens.push(i)}));
 if(w.ass)itens.push({id:uid(),txt:"Assinatura do responsável pelo local",tipo:"ass",sec:"Fechamento",como:"Quem responde pelo local assina ao final, depois de ver o plano de ação.",peso:1});
 return{id:uid(),nome:`${OBJN[o]} · ${SEGN[s]}`,visita:["aud","qual","inv","seg"].includes(o)?1:0,briefing:w.br,itens}}
function pedido(w){const n=+w.tam,o=OBJ.find(x=>x[0]===w.obj)[1],p=PONT.find(x=>x[0]===w.pont);
 return `Monte um checklist de campo em português do Brasil.
Contexto da empresa: ${w.br||"não informado"}
Objetivo: ${o}. Tamanho: cerca de ${n} perguntas.
Forma de pontuar: ${p[1]}. ${p[2]}
Regras:
- Agrupe em seções na ordem do percurso físico de quem aplica.
- Perguntas afirmativas e objetivas, em que a resposta boa é sempre "conforme". Não misture polaridade.
- Para cada pergunta, escreva em "como" o que olhar, a amostra e o número de referência.
- "peso" 1, 2, 3 ou 5 conforme o risco. "critico": true só para risco à vida, legal ou ao produto; a falha zera a nota.
- "fotoNC": true quando a falha precisa de evidência.
- "acao": a ação corretiva padrão se a pergunta falhar.
- Tipos: "sn" (conforme / não conforme), "esc" (nota de 1 a 5), "opc" (escolha com "opcoes":[{"t":texto,"p":0 a 100}]), "num" (número com "min" e "max" aceitáveis), "txt", "foto", "ass" (assinatura).
${w.pont==="bin"?'- Use só "sn", peso 1 e nenhum crítico.':w.pont==="esc"?'- Use "esc" na maioria; "sn" só para os itens críticos.':w.pont==="peso"?'- Use "sn" com pesos e críticos; "num" quando houver medição com faixa.':"- Escolha o melhor tipo para cada pergunta."}
${w.ass?'- Termine com uma pergunta do tipo "ass": assinatura do responsável pelo local.':""}
Responda só com JSON, sem texto antes ou depois:
{"nome":string,"visita":boolean,"itens":[{"sec":string,"txt":string,"tipo":string,"peso":number,"critico":boolean,"fotoNC":boolean,"como":string,"acao":string,"opcoes":[],"min":null,"max":null}]}`}
function normTpl(o,w){const num=v=>v===null||v===undefined||v===""||isNaN(+v)?null:+v,ok=TIPOS.map(t=>t[0]);
 return{id:uid(),nome:String(o.nome||"Novo roteiro").slice(0,80),visita:o.visita!=null?(o.visita?1:0):w&&w.obj==="aud"?1:0,briefing:w?w.br:"",
  itens:(Array.isArray(o.itens)?o.itens:[]).filter(i=>i&&i.txt).slice(0,80).map(i=>{const tipo=ok.includes(i.tipo)?i.tipo:"sn";
   const it={id:uid(),txt:String(i.txt).slice(0,200),tipo,sec:i.sec?String(i.sec).slice(0,60):"",peso:PESOS.includes(+i.peso)?+i.peso:1,critico:!!i.critico,fotoNC:!!i.fotoNC,como:i.como?String(i.como):"",acao:i.acao?String(i.acao):""};
   if(tipo==="opc"){it.opcoes=(Array.isArray(i.opcoes)?i.opcoes:[]).map(x=>({t:String(x&&typeof x==="object"?x.t??x.texto??"":x).slice(0,40),p:Math.max(0,Math.min(100,+(x&&x.p)||0))})).filter(x=>x.t);if(it.opcoes.length<2)it.opcoes=[{t:"Bom",p:100},{t:"Regular",p:50},{t:"Ruim",p:0}]}
   if(tipo==="num"){it.min=num(i.min);it.max=num(i.max)}
   if(!PONTUA.includes(tipo)){it.peso=1;it.critico=false;it.fotoNC=false}return it})}}
const segW=(k,ops,v)=>`<div class="seg wrap">${ops.map(([o,l])=>`<button data-wk="${k}" data-wo="${o}" aria-pressed="${v===o}">${esc(l)}</button>`).join("")}</div>`;

 a.querySelectorAll("[data-wk]").forEach(b=>b.onclick=()=>{w[b.dataset.wk]=b.dataset.wo;er()});

  w.busy=1;w.msg="";er();const r=await ia(pedido(w));w.busy=0;
  const t=r&&Array.isArray(r.itens)&&r.itens.length?normTpl(r,w):null;t&&t.itens.length?abre(t,"IA"):abre(gerarLocal(w),"biblioteca")};
 $("#wz-cp").onclick=async()=>{const b=$("#wz-cp");try{await navigator.clipboard.writeText(pedido(w));b.textContent="Pedido copiado"}catch(e){const d=a.querySelector("details");d.open=true;$("#wz-pd").select();b.textContent="Selecione e copie o texto abaixo"}};
 $("#wz-imp").onclick=()=>{const s=w.imp||"";try{const j=JSON.parse(s.slice(s.indexOf("{"),s.lastIndexOf("}")+1));const t=normTpl(j,w);if(!t.itens.length)throw 0;abre(t,"outra IA")}catch(e){w.msg="Não consegui ler a resposta. Cole o JSON completo, do { ao }.";er()}};

 return a.map((x,k)=>{const m=x.match(/^(.*?)\s*=\s*(-?\d+)\s*$/);return m?{t:m[1].trim(),p:Math.max(0,Math.min(100,+m[2]))}:{t:x,p:a.length>1?Math.round(100*(a.length-1-k)/(a.length-1)):100}}).filter(o=>o.t)}

 const secs=[...new Set(edit.itens.map(i=>i.sec).filter(Boolean))],pt=edit.itens.filter(i=>PONTUA.includes(i.tipo)),tw=pt.reduce((s,i)=>s+(+i.peso||1),0),nc=edit.itens.filter(i=>i.critico).length,existe=S.templates.some(t=>t.id===edit.id);
