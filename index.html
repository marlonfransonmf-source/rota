<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Rota Checklist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1F4D3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de uma coluna, barra de abas fixa embaixo como app nativo */
:root{--bg:#F2F4F1;--card:#FFFFFF;--fg:#17201B;--mut:#5E6B63;--line:#DCE2DD;--brand:#1F4D3A;--brand-fg:#FFFFFF;--sun:#F2C14E;--ok:#2E8B57;--bad:#C2452D;--na:#8A948E;
--fd:"Bricolage Grotesque",Georgia,sans-serif;--fb:"Figtree",system-ui,sans-serif;--fm:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1512;--card:#18211C;--fg:#E8EEE9;--mut:#93A198;--line:#2A362F;--brand:#7FC8A0;--brand-fg:#0F1512;--sun:#F2C14E;--ok:#5CC98A;--bad:#F07A62;--na:#7B877F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1512;--card:#18211C;--fg:#E8EEE9;--mut:#93A198;--line:#2A362F;--brand:#7FC8A0;--brand-fg:#0F1512;--sun:#F2C14E;--ok:#5CC98A;--bad:#F07A62;--na:#7B877F;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--fb);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{padding-block:20px 4px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font:800 28px/1.05 var(--fd);margin:0;letter-spacing:-.02em}
h2{font:600 19px/1.2 var(--fd);margin:0;text-wrap:balance}
.eb{font:500 11px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
button{font:600 14px var(--fb);border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:10px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.pri{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.tabs button{border:0;background:none;color:var(--mut);font-size:13px;padding:10px 4px}
.tabs button[aria-current="true"]{color:var(--brand)}
.tabs b{display:block;font:800 18px var(--fd)}
.tpl{display:flex;justify-content:space-between;align-items:center;gap:12px}
.meta{color:var(--mut);font-size:13px}
.num{font:500 13px var(--fm);font-variant-numeric:tabular-nums}
.item{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.item:first-of-type{border-top:0;padding-top:0}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 6px}
.seg button[aria-pressed="true"][data-v="c"]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="nc"]{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button[aria-pressed="true"][data-v="na"]{background:var(--na);border-color:var(--na);color:#fff}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.pill{font:500 11px var(--fm);padding:3px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi b{display:block;font:800 26px var(--fd)}
.ex{font:500 10px var(--fm);background:var(--sun);color:#17201B;padding:2px 6px;border-radius:4px;letter-spacing:.06em}
.empty{color:var(--mut);text-align:center;padding:24px}
.loc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;border-top:1px solid var(--line);padding-top:10px}.loc:first-of-type{border-top:0;padding-top:0}.ia{border-color:var(--brand)}.ia ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}.f3{display:grid;grid-template-columns:1fr 1fr 90px;gap:8px}@media(max-width:420px){.f3{grid-template-columns:1fr 1fr}}
.ed{display:grid;grid-template-columns:1fr 120px 40px;gap:8px}
@media (max-width:420px){.kpis{grid-template-columns:1fr 1fr 1fr}.kpi b{font-size:21px}}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease both}@keyframes in{from{transform:translateY(4px)}}}
</style>

<main id="app"></main>
<nav class="tabs" aria-label="Seções">
  <button id="t-run" data-t="run"><b>✓</b>Executar</button>
  <button id="t-tpl" data-t="tpl"><b>＋</b>Modelos</button>
  <button id="t-rep" data-t="rep"><b>≡</b>Relatórios</button>
  <button id="t-pal" data-t="pal"><b>▦</b>Paletes</button>
</nav>

<script>
const K="rota.v1";const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const SEED={templates:[
 {id:"t1",nome:"Abertura do hub",ex:1,itens:[
  {id:"a",txt:"Docas livres e sinalizadas",tipo:"sn"},{id:"b",txt:"Empilhadeira com checklist do turno",tipo:"sn"},
  {id:"c",txt:"Temperatura da área de stage (°C)",tipo:"num"},{id:"d",txt:"Corredores sem material solto",tipo:"sn"},{id:"e",txt:"Foto da expedição",tipo:"foto"}]},
 {id:"t2",nome:"Vistoria de veículo",ex:1,itens:[
  {id:"a",txt:"Pneus e estepe em bom estado",tipo:"sn"},{id:"b",txt:"Baú limpo e sem infiltração",tipo:"sn"},
  {id:"c",txt:"Placa",tipo:"txt"},{id:"d",txt:"Foto do baú",tipo:"foto"}]}],
 pool:{locais:[
  {id:"l1",nome:"CD Cajamar (próprio)",tipo:"CD"},{id:"l2",nome:"Atacado Norte · Guarulhos",tipo:"Cliente"},{id:"l3",nome:"Supermercado Bom Preço",tipo:"Cliente"},
  {id:"l4",nome:"Transportadora Rota Sul",tipo:"Transportador"},{id:"l5",nome:"Base de reparo Osasco",tipo:"Reparo"}],
 movs:[["l1","envio",1200,30],["l2","envio",420,20],["l2","retorno",180,8],["l3","envio",260,25],["l3","retorno",40,5],["l4","envio",150,12],["l4","retorno",90,3],["l5","envio",80,15],["l5","retorno",60,2],["l2","perda",12,6]].map(([local,tipo,qtd,d],i)=>({id:"m"+i,local,tipo,qtd,ts:Date.now()-d*864e5,...(tipo==="retorno"?{insp:{bom:Math.round(qtd*.82),rep:Math.round(qtd*.13),suc:qtd-Math.round(qtd*.82)-Math.round(qtd*.13)}}:{})})),
 coletas:[{id:"k1",local:"l2",qtd:150,data:new Date(Date.now()+2*864e5).toISOString().slice(0,10),ok:false},{id:"k2",local:"l3",qtd:120,data:new Date(Date.now()+5*864e5).toISOString().slice(0,10),ok:false}],
 contagens:[{id:"c1",local:"l1",qtd:1195,ts:Date.now()-3*864e5},{id:"c2",local:"l2",qtd:205,ts:Date.now()-40*864e5},{id:"c3",local:"l3",qtd:221,ts:Date.now()-9*864e5},{id:"c4",local:"l4",qtd:58,ts:Date.now()-2*864e5}]},
 execs:[
 {id:"e1",tpl:"t1",nome:"Abertura do hub",autor:"Exemplo",ts:Date.now()-864e5,ex:1,resp:{a:{v:"c"},b:{v:"nc",obs:"Checklist do turno não preenchido"},c:{v:"22"},d:{v:"c"}},acoes:[{id:"x1",txt:"Checklist do turno não preenchido",dono:"Líder do turno",feito:false}]},
 {id:"e2",tpl:"t2",nome:"Vistoria de veículo",autor:"Exemplo",ts:Date.now()-2*864e5,ex:1,resp:{a:{v:"c"},b:{v:"c"},c:{v:"ABC1D23"}},acoes:[]}]};
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=structuredClone(SEED);if(!S.pool)S.pool=structuredClone(SEED.pool);if(!S.pool.coletas)S.pool.coletas=structuredClone(SEED.pool.coletas);
let sampleP=null;setTimeout(()=>{try{sampleP=window.claude?.use?window.claude.use("sample"):Promise.resolve(null)}catch(e){sampleP=Promise.resolve(null)}},0);let iaOut=null,iaBusy=false;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let tab="run",cur=null,edit=null;

function score(x){const t=S.templates.find(t=>t.id===x.tpl);const sn=(t?t.itens:[]).filter(i=>i.tipo==="sn");
 const v=sn.map(i=>x.resp[i.id]?.v).filter(v=>v==="c"||v==="nc");return v.length?Math.round(100*v.filter(x=>x==="c").length/v.length):null}
const dt=ts=>new Date(ts).toLocaleString("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});

function go(t){tab=t;cur=null;edit=null;render()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>go(b.dataset.t));

function render(){
 document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.t===tab));
 const a=$("#app");
 if(cur)return runView(a);
 if(edit)return editView(a);
 const head=`<header><div><div class="eb">Checklists de operação</div><h1>Rota</h1></div><button id="reset" title="Volta aos dados de exemplo">Exemplos</button></header>`;
 if(tab==="run"){
  a.innerHTML=head+`<div class="eb">Escolha um checklist para começar</div>`+S.templates.map(t=>`<div class="card tpl"><div style="min-width:0"><h2>${esc(t.nome)}</h2><div class="meta">${t.itens.length} itens ${t.ex?'<span class="ex">EXEMPLO</span>':""}</div></div><button class="pri" data-run="${t.id}">Iniciar</button></div>`).join("");
  a.querySelectorAll("[data-run]").forEach(b=>b.onclick=()=>{const t=S.templates.find(x=>x.id===b.dataset.run);cur={id:uid(),tpl:t.id,nome:t.nome,autor:"Você",ts:Date.now(),resp:{},acoes:[]};render()});
 }
 if(tab==="tpl"){
  a.innerHTML=head+`<button class="pri" id="novo">Novo modelo</button>`+S.templates.map(t=>`<div class="card tpl"><div style="min-width:0"><h2>${esc(t.nome)}</h2><div class="meta">${t.itens.map(i=>esc(i.txt)).slice(0,3).join(" · ")}${t.itens.length>3?" …":""}</div></div><button data-ed="${t.id}">Editar</button></div>`).join("");
  $("#novo").onclick=()=>{edit={id:uid(),nome:"",itens:[{id:uid(),txt:"",tipo:"sn"}]};render()};
  a.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{edit=structuredClone(S.templates.find(x=>x.id===b.dataset.ed));render()});
 }
 if(tab==="rep"){
  const ex=S.execs,sc=ex.map(score).filter(v=>v!=null),med=sc.length?Math.round(sc.reduce((a,b)=>a+b)/sc.length):0;
  const ab=ex.flatMap(e=>e.acoes.map(x=>({...x,e}))).filter(x=>!x.feito);
  a.innerHTML=head+`<div class="kpis"><div class="card kpi"><span class="eb">Execuções</span><b class="num">${ex.length}</b></div><div class="card kpi"><span class="eb">Conformidade</span><b>${med}%</b></div><div class="card kpi"><span class="eb">Ações abertas</span><b class="${ab.length?"bad":"ok"}">${ab.length}</b></div></div>
  <div class="card"><h2>Plano de ação</h2>${ab.length?ab.map(x=>`<label class="row"><input type="checkbox" id="ac-${x.id}" data-ac="${x.id}" style="width:auto"><span class="sp" style="min-width:0"><b>${esc(x.txt)}</b><br><span class="meta">${esc(x.dono||"Sem responsável")} · ${esc(x.e.nome)} · ${dt(x.e.ts)}</span></span></label>`).join(""):`<p class="empty">Nenhuma não conformidade em aberto.</p>`}</div>
  <div class="eb">Histórico</div>`+(ex.length?ex.slice().sort((a,b)=>b.ts-a.ts).map(e=>{const s=score(e);return `<div class="card"><div class="tpl"><div style="min-width:0"><h2>${esc(e.nome)}</h2><div class="meta">${esc(e.autor)} · ${dt(e.ts)} ${e.ex?'<span class="ex">EXEMPLO</span>':""}</div></div><span class="pill ${s>=90?"ok":"bad"}">${s==null?"—":s+"%"}</span></div><div class="bar"><i style="width:${s||0}%"></i></div></div>`}).join(""):`<p class="empty">Nenhum checklist executado ainda.</p>`);
  a.querySelectorAll("[data-ac]").forEach(c=>c.onchange=()=>{S.execs.forEach(e=>e.acoes.forEach(x=>{if(x.id===c.dataset.ac)x.feito=true}));save();render()});
 }
 if(tab==="pal")palView(a,head);
 $("#reset").onclick=()=>{const b=$("#reset");if(b.dataset.c){S=structuredClone(SEED);save();render()}else{b.dataset.c=1;b.textContent="Confirmar?"}};
}


/* ===== Pool de paletes: saldo contábil x contagem física (modelo pooling) ===== */
const CICLO={CD:7,Cliente:30,Transportador:15,Reparo:30};
function poolCalc(){const P=S.pool;return P.locais.map(l=>{
 const mv=P.movs.filter(m=>m.local===l.id);const saldo=mv.reduce((a,m)=>a+(m.tipo==="envio"?m.qtd:-m.qtd),0);
 const perdas=mv.filter(m=>m.tipo==="perda").reduce((a,m)=>a+m.qtd,0);
 const c=P.contagens.filter(x=>x.local===l.id).sort((a,b)=>b.ts-a.ts)[0];
 const saldoNaContagem=c?mv.filter(m=>m.ts<=c.ts).reduce((a,m)=>a+(m.tipo==="envio"?m.qtd:-m.qtd),0):null;
 const div=c?c.qtd-saldoNaContagem:null;const divPct=c&&saldoNaContagem?Math.round(1000*div/saldoNaContagem)/10:null;
 const dias=c?Math.floor((Date.now()-c.ts)/864e5):null;const ciclo=CICLO[l.tipo]||30;
 const prio=Math.round((saldo/50)+(Math.abs(divPct||0)*2)+(dias==null?40:Math.max(0,dias-ciclo)));
 return{...l,saldo,perdas,ult:c,div,divPct,dias,ciclo,vencida:dias==null||dias>ciclo,prio}}).sort((a,b)=>b.prio-a.prio)}
function palView(a,head){
 const L=poolCalc(),tot=L.reduce((x,l)=>x+l.saldo,0),fora=L.filter(l=>l.tipo!=="CD").reduce((x,l)=>x+l.saldo,0);
 const divTot=L.reduce((x,l)=>x+(l.div||0),0),venc=L.filter(l=>l.vencida).length;
 const R=S.pool.movs.filter(m=>m.insp),it=R.reduce((a,m)=>({b:a.b+m.insp.bom,r:a.r+m.insp.rep,s:a.s+m.insp.suc}),{b:0,r:0,s:0}),tt=it.b+it.r+it.s;
 const insp={tot:tt,pb:tt?Math.round(100*it.b/tt):0,pr:tt?Math.round(100*it.r/tt):0,ps:tt?Math.round(100*it.s/tt):0};
 const opt=L.map(l=>`<option value="${l.id}">${esc(l.nome)}</option>`).join("");
 a.innerHTML=head+`<div class="eb">Pool de paletes · saldo contábil × contagem física</div>
 <div class="kpis"><div class="card kpi"><span class="eb">No pool</span><b class="num">${tot}</b><span class="meta">${fora} fora do CD</span></div><div class="card kpi"><span class="eb">Divergência</span><b class="${divTot<0?"bad":"ok"}">${divTot>0?"+":""}${divTot}</b><span class="meta">físico − contábil</span></div><div class="card kpi"><span class="eb">Contagens vencidas</span><b class="${venc?"bad":"ok"}">${venc}</b><span class="meta">de ${L.length} locais</span></div></div>
 <div class="card ia"><div class="row"><h2 class="sp">Análise da IA</h2><button class="pri" id="ia-go">${iaBusy?"Analisando…":"Analisar pool"}</button></div><div id="ia-box">${iaOut||`<p class="meta">A IA lê saldos, divergências, perdas e idade das contagens e devolve onde contar primeiro, onde cobrar devolução e o risco de perda.</p>`}</div></div>
 <div class="card"><div class="row"><h2 class="sp">Fila de inventário</h2><span class="meta">ordem de prioridade</span></div>${L.map(l=>`<div class="loc"><div style="min-width:0"><b>${esc(l.nome)}</b><div class="meta">${l.tipo} · saldo <span class="num">${l.saldo}</span>${l.perdas?` · ${l.perdas} perdidos`:""}</div><div class="meta">${l.ult?`Contado há ${l.dias}d (ciclo ${l.ciclo}d)${l.div!=null?` · diferença <span class="num">${l.div>0?"+":""}${l.div}</span> (${l.divPct}%)`:""}`:"Nunca contado"}</div></div><div style="text-align:right"><span class="pill ${l.vencida||Math.abs(l.divPct||0)>3?"bad":"ok"}">${l.vencida?"Contar":"Em dia"}</span></div></div>`).join("")}</div>
 <div class="card"><div class="row"><h2 class="sp">Coletas agendadas</h2><span class="meta">${insp.tot?`Inspeção dos retornos: ${insp.pb}% bons · ${insp.pr}% reparo · ${insp.ps}% sucata`:""}</span></div>${S.pool.coletas.filter(c=>!c.ok).sort((a,b)=>a.data.localeCompare(b.data)).map(c=>`<label class="row"><input type="checkbox" id="co-${c.id}" data-co="${c.id}" style="width:auto"><span class="sp"><b>${esc((S.pool.locais.find(l=>l.id===c.local)||{}).nome||"")}</b><br><span class="meta">${c.data.split("-").reverse().join("/")} · ${c.qtd} paletes</span></span></label>`).join("")||`<p class="meta">Nenhuma coleta pendente.</p>`}
 <div class="f3"><select id="co-l">${opt}</select><input id="co-d" type="date"><input id="co-q" type="number" inputmode="numeric" placeholder="Qtd"></div><button id="co-ok">Agendar coleta</button><p class="meta">Marcar a coleta como feita já lança o retorno no saldo.</p></div>
 <div class="card"><h2>Lançar movimento</h2><div class="f3"><select id="mv-l">${opt}</select><select id="mv-t"><option value="envio">Envio</option><option value="retorno">Retorno</option><option value="perda">Perda/dano</option></select><input id="mv-q" type="number" inputmode="numeric" placeholder="Qtd"></div><div id="mv-insp" class="f3"><input id="mv-bom" type="number" inputmode="numeric" placeholder="Bons"><input id="mv-rep" type="number" inputmode="numeric" placeholder="Para reparo"><input id="mv-suc" type="number" inputmode="numeric" placeholder="Sucata"></div><p class="meta">No retorno, a inspeção separa o que volta ao pool, o que vai para reparo e o que é descartado.</p><button id="mv-ok">Registrar movimento</button></div>
 <div class="card"><h2>Lançar contagem física</h2><div class="f3"><select id="ct-l">${opt}</select><input id="ct-q" type="number" inputmode="numeric" placeholder="Paletes contados"><button class="pri" id="ct-ok">Salvar</button></div><p class="meta">A contagem fecha o ciclo do local e mostra a diferença contra o saldo contábil daquele momento.</p></div>
 <div class="card"><h2>Novo local</h2><div class="f3"><input id="nl-n" placeholder="Nome do cliente ou base"><select id="nl-t"><option>Cliente</option><option>CD</option><option>Transportador</option><option>Reparo</option></select><button id="nl-ok">Adicionar</button></div></div>`;
 $("#mv-ok").onclick=()=>{const q=+$("#mv-q").value;if(!q)return;const m={id:uid(),local:$("#mv-l").value,tipo:$("#mv-t").value,qtd:q,ts:Date.now()};if(m.tipo==="retorno"){m.insp={bom:+$("#mv-bom").value||0,rep:+$("#mv-rep").value||0,suc:+$("#mv-suc").value||0};if(m.insp.bom+m.insp.rep+m.insp.suc===0)m.insp.bom=q}S.pool.movs.push(m);save();render()};
 $("#co-ok").onclick=()=>{const q=+$("#co-q").value,d=$("#co-d").value;if(!q||!d)return;S.pool.coletas.push({id:uid(),local:$("#co-l").value,qtd:q,data:d,ok:false});save();render()};
 a.querySelectorAll("[data-co]").forEach(c=>c.onchange=()=>{const x=S.pool.coletas.find(k=>k.id===c.dataset.co);x.ok=true;S.pool.movs.push({id:uid(),local:x.local,tipo:"retorno",qtd:x.qtd,ts:Date.now(),insp:{bom:x.qtd,rep:0,suc:0}});save();render()});
 $("#ct-ok").onclick=()=>{const v=$("#ct-q").value;if(v==="")return;S.pool.contagens.push({id:uid(),local:$("#ct-l").value,qtd:+v,ts:Date.now()});save();render()};
 $("#nl-ok").onclick=()=>{const n=$("#nl-n").value.trim();if(!n)return;S.pool.locais.push({id:uid(),nome:n,tipo:$("#nl-t").value});save();render()};
 $("#ia-go").onclick=()=>analisar(L);
}
function regras(L){const out=[];L.filter(l=>l.vencida).slice(0,3).forEach(l=>out.push(`Contar <b>${esc(l.nome)}</b>: ${l.ult?`última contagem há ${l.dias} dias, ciclo de ${l.ciclo}`:"nunca contado"}, saldo de ${l.saldo} paletes.`));
 L.filter(l=>(l.divPct||0)<-3).forEach(l=>out.push(`Divergência em <b>${esc(l.nome)}</b>: faltam ${-l.div} paletes (${l.divPct}%). Abrir cobrança ou reconciliação de movimentos.`));
 L.filter(l=>l.tipo==="Cliente"&&l.saldo>200).forEach(l=>out.push(`<b>${esc(l.nome)}</b> segura ${l.saldo} paletes. Agendar coleta de retorno.`));
 return `<p class="meta">Análise por regras (IA indisponível nesta visualização).</p><ul>${out.map(x=>`<li>${x}</li>`).join("")||"<li>Pool equilibrado.</li>"}</ul>`}
async function analisar(L){
 const s=sampleP?await sampleP:null;
 if(!s){iaOut=regras(L);render();return}
 iaBusy=true;render();
 const R=S.pool.movs.filter(m=>m.insp),insp=R.reduce((a,m)=>({bons:a.bons+m.insp.bom,reparo:a.reparo+m.insp.rep,sucata:a.sucata+m.insp.suc}),{bons:0,reparo:0,sucata:0}),col=S.pool.coletas.filter(c=>!c.ok).map(c=>({local:(S.pool.locais.find(l=>l.id===c.local)||{}).nome,data:c.data,qtd:c.qtd}));
 const dados=L.map(l=>({local:l.nome,tipo:l.tipo,saldo_contabil:l.saldo,perdas:l.perdas,dias_desde_contagem:l.dias,ciclo_dias:l.ciclo,divergencia:l.div,divergencia_pct:l.divPct}));
 try{const r=await s.json(`Você é analista de um pool de paletes retornáveis (modelo de locação de paletes vermelhos como a GEE, Gestão Eficiente de Embalagens, e a CHEP: o dono do ativo emite paletes para clientes, cobra por dia em poder e precisa recuperar e reconciliar o saldo). Analise os dados e responda em português do Brasil, direto, em JSON {"resumo":string,"acoes":[{"prioridade":"alta"|"media"|"baixa","local":string,"acao":string,"porque":string}],"risco_perda":string}. No máximo 5 ações, ordenadas por impacto. Considere também abastecimento, coletas agendadas e a inspeção dos retornos (bons voltam ao pool, reparo vai para manutenção, sucata é baixa). Dados: ${JSON.stringify({locais:dados,inspecao_retornos:insp,coletas_pendentes:col})}`,{modelTier:"default"});
  iaOut=`<p>${esc(r.resumo)}</p><ul>${(r.acoes||[]).map(x=>`<li><span class="pill ${x.prioridade==="alta"?"bad":"ok"}">${esc(x.prioridade)}</span> <b>${esc(x.local)}</b>: ${esc(x.acao)} <span class="meta">${esc(x.porque)}</span></li>`).join("")}</ul><p class="meta">Risco de perda: ${esc(r.risco_perda)}</p>`}
 catch(e){iaOut=regras(L)}
 iaBusy=false;render()}

function runView(a){
 const t=S.templates.find(x=>x.id===cur.tpl);const feitos=t.itens.filter(i=>cur.resp[i.id]?.v).length;
 a.innerHTML=`<header><div><div class="eb">Em execução</div><h1>${esc(t.nome)}</h1></div><button id="sair">Sair</button></header>
 <div class="card"><div class="row"><span class="meta sp">${feitos} de ${t.itens.length} respondidos</span><span class="num">${Math.round(100*feitos/t.itens.length)}%</span></div><div class="bar"><i style="width:${100*feitos/t.itens.length}%"></i></div></div>
 <div class="card">${t.itens.map(i=>{const r=cur.resp[i.id]||{};let ctl="";
  if(i.tipo==="sn")ctl=`<div class="seg">${[["c","Conforme"],["nc","Não conf."],["na","N/A"]].map(([v,l])=>`<button data-i="${i.id}" data-v="${v}" aria-pressed="${r.v===v}">${l}</button>`).join("")}</div>${r.v==="nc"?`<input id="o-${i.id}" data-o="${i.id}" placeholder="O que está errado?" value="${esc(r.obs||"")}"><input id="d-${i.id}" data-d="${i.id}" placeholder="Responsável pela correção" value="${esc(r.dono||"")}">`:""}`;
  if(i.tipo==="num")ctl=`<input id="n-${i.id}" type="number" inputmode="decimal" data-t="${i.id}" value="${esc(r.v||"")}">`;
  if(i.tipo==="txt")ctl=`<input id="x-${i.id}" data-t="${i.id}" value="${esc(r.v||"")}">`;
  if(i.tipo==="foto")ctl=`<div class="row">${r.v?`<img class="thumb" src="${r.v}" alt="Foto anexada">`:""}<input id="f-${i.id}" type="file" accept="image/*" capture="environment" data-f="${i.id}"></div>`;
  return `<div class="item"><b>${esc(i.txt)}</b>${ctl}</div>`}).join("")}</div>
 <button class="pri" id="fim">Concluir checklist</button>`;
 $("#sair").onclick=()=>go("run");
 a.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{const id=b.dataset.i;cur.resp[id]={...cur.resp[id],v:b.dataset.v};render()});
 a.querySelectorAll("[data-o]").forEach(x=>x.oninput=()=>cur.resp[x.dataset.o].obs=x.value);
 a.querySelectorAll("[data-d]").forEach(x=>x.oninput=()=>cur.resp[x.dataset.d].dono=x.value);
 a.querySelectorAll("[data-t]").forEach(x=>x.onchange=()=>{cur.resp[x.dataset.t]={v:x.value};render()});
 a.querySelectorAll("[data-f]").forEach(x=>x.onchange=()=>{const f=x.files[0];if(!f)return;const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,480/img.width);c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);cur.resp[x.dataset.f]={v:c.toDataURL("image/jpeg",.6)};render()};img.src=URL.createObjectURL(f)});
 $("#fim").onclick=()=>{t.itens.forEach(i=>{const r=cur.resp[i.id];if(r&&r.v==="nc")cur.acoes.push({id:uid(),txt:r.obs||i.txt,dono:r.dono||"",feito:false})});S.execs.push(cur);save();go("rep")};
}

function editView(a){
 a.innerHTML=`<header><div><div class="eb">Construtor</div><h1>${edit.nome?esc(edit.nome):"Novo modelo"}</h1></div><button id="sair">Cancelar</button></header>
 <div class="card"><label class="eb" for="ed-nome">Nome do checklist</label><input id="ed-nome" value="${esc(edit.nome)}" placeholder="Ex.: Fechamento do turno"></div>
 <div class="card"><div class="eb">Itens</div>${edit.itens.map((i,k)=>`<div class="ed"><input id="it-${i.id}" data-k="${k}" value="${esc(i.txt)}" placeholder="Pergunta"><select id="ty-${i.id}" data-s="${k}">${[["sn","Sim/Não"],["num","Número"],["txt","Texto"],["foto","Foto"]].map(([v,l])=>`<option value="${v}" ${i.tipo===v?"selected":""}>${l}</option>`).join("")}</select><button data-x="${k}" aria-label="Remover item">×</button></div>`).join("")}
 <button id="add">Adicionar item</button></div>
 <div class="row"><button class="pri sp" id="salvar">Salvar modelo</button>${S.templates.some(t=>t.id===edit.id)?`<button id="del">Excluir</button>`:""}</div>`;
 $("#sair").onclick=()=>go("tpl");
 $("#ed-nome").oninput=e=>edit.nome=e.target.value;
 a.querySelectorAll("[data-k]").forEach(x=>x.oninput=()=>edit.itens[x.dataset.k].txt=x.value);
 a.querySelectorAll("[data-s]").forEach(x=>x.onchange=()=>edit.itens[x.dataset.s].tipo=x.value);
 a.querySelectorAll("[data-x]").forEach(x=>x.onclick=()=>{edit.itens.splice(x.dataset.x,1);render()});
 $("#add").onclick=()=>{edit.itens.push({id:uid(),txt:"",tipo:"sn"});render()};
 $("#salvar").onclick=()=>{edit.itens=edit.itens.filter(i=>i.txt.trim());if(!edit.nome.trim()||!edit.itens.length){$("#salvar").textContent="Dê um nome e ao menos 1 item";return}
  delete edit.ex;const k=S.templates.findIndex(t=>t.id===edit.id);if(k>=0)S.templates[k]=edit;else S.templates.push(edit);save();go("tpl")};
 const d=$("#del");if(d)d.onclick=()=>{if(!d.dataset.c){d.dataset.c=1;d.textContent="Confirmar";return}S.templates=S.templates.filter(t=>t.id!==edit.id);save();go("tpl")};
}
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});navigator.serviceWorker?.addEventListener("controllerchange",()=>{if(!window.__rl){window.__rl=1;location.reload()}});
</script>
