<style>
/* Layout: app de uma coluna, barra de abas fixa embaixo como app nativo */
:root{--bg:#F2F4F1;--card:#FFFFFF;--fg:#17201B;--mut:#5E6B63;--line:#DCE2DD;--brand:#1F4D3A;--brand-fg:#FFFFFF;--sun:#F2C14E;--ok:#2E8B57;--bad:#C2452D;--na:#8A948E;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1512;--card:#18211C;--fg:#E8EEE9;--mut:#93A198;--line:#2A362F;--brand:#7FC8A0;--brand-fg:#0F1512;--sun:#F2C14E;--ok:#5CC98A;--bad:#F07A62;--na:#7B877F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1512;--card:#18211C;--fg:#E8EEE9;--mut:#93A198;--line:#2A362F;--brand:#7FC8A0;--brand-fg:#0F1512;--sun:#F2C14E;--ok:#5CC98A;--bad:#F07A62;--na:#7B877F;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--fb);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 104px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

h2{font:600 19px/1.2 var(--fd);margin:0;text-wrap:balance}

button{font:600 14px var(--fb);border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:10px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.pri{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.tabs button{border:0;background:none;color:var(--mut);font-size:13px;padding:10px 4px}
.tabs button[aria-current="true"]{color:var(--brand)}
.tabs b{display:block;font:800 18px var(--fd)}
.tpl{display:flex;flex-direction:row;justify-content:space-between;align-items:center;gap:12px}
.meta{color:var(--mut);font-size:13px}
.num{font:500 13px var(--fm);font-variant-numeric:tabular-nums}
.item{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.item:first-of-type{border-top:0;padding-top:0}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 6px}

.seg button[aria-pressed="true"][data-v="nc"]{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button[aria-pressed="true"][data-v="na"]{background:var(--na);border-color:var(--na);color:#fff}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.pill{font:500 11px var(--fm);padding:3px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi b{display:block;font:800 26px var(--fd)}
.ex{font:500 10px var(--fm);background:var(--sun);color:#17201B;padding:2px 6px;border-radius:4px;letter-spacing:.06em}
.empty{color:var(--mut);text-align:center;padding:24px}
.loc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;border-top:1px solid var(--line);padding-top:10px}.loc:first-of-type{border-top:0;padding-top:0}.ia{border-color:var(--brand)}.ia ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}.f3{display:grid;grid-template-columns:1fr 1fr 90px;gap:8px}@media(max-width:420px){.f3{grid-template-columns:1fr 1fr}}
.ed{display:grid;grid-template-columns:1fr 120px 40px;gap:8px}
@media (max-width:420px){.kpis{grid-template-columns:1fr 1fr 1fr}.kpi b{font-size:21px}}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease both}@keyframes in{from{transform:translateY(4px)}}}

.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:420px){.f2{grid-template-columns:1fr}}
details summary{cursor:pointer;color:var(--mut);font-size:13px}.como{font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:6px}
.fbtn{font:600 13px var(--fb);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--fg);background:var(--card)}

.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th,.tb td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tb th{font:500 11px var(--fm);text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.rf{width:220px;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}
@media print{
 :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff;--card:#fff;--fg:#111;--mut:#555;--line:#ccc;--brand:#1F4D3A;--ok:#2E7D4F;--bad:#B23A24;--na:#777;color-scheme:light}
 .tabs,.np{display:none!important}body{padding:0;background:#fff}main{max-width:none;gap:10px}
 .card{break-inside:avoid;animation:none!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<main id="app"></main>
<nav class="tabs"><button data-t="pal"><b>&#9707;</b>Paletes</button><button data-t="run"><b>&#10003;</b>Visitas</button><button data-t="tpl"><b>&#8801;</b>Modelos</button><button data-t="rep"><b>%</b>Relatórios</button></nav>


<script>
const K="rota.v1";const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);

const ROTEIRO=[
 ["Segurança e EPI",[
  ["EPI completo na operação","Observe 10 pessoas no pátio: luva, bota com biqueira e óculos no corte e na pregação. Uma pessoa sem EPI já é não conformidade."],
  ["Circulação de empilhadeira sinalizada","Faixa de pedestre pintada, espelho nas esquinas e velocidade controlada. Fique 5 minutos num cruzamento."],
  ["Pilhas dentro da altura máxima","Pilha de palete vazio no limite definido pelo centro (referência comum: 2,5 m ou 15 a 18 unidades), prumada e sem palete quebrado na base."],
  ["Extintores e rotas de fuga livres","Extintor no lugar, com lacre e validade em dia, e nenhuma pilha bloqueando porta ou rota."]]],
 ["Recebimento e triagem",[
  ["Retorno conferido contra a ordem de coleta","Pegue a última coleta recebida e compare quantidade física, nota e sistema. Diferença sem registro é não conformidade."],
  ["Triagem feita no dia","Não pode haver palete de retorno parado sem classificação há mais de 24h. Pergunte a data da carga mais antiga no pátio."],
  ["Paletes de terceiros segregados","Palete que não é do pool, de outra cor ou outro dono, fica em área separada e identificada para devolução."],
  ["Avarias registradas com foto","Carga que chega muito danificada tem foto e registro para cobrança do cliente."]]],
 ["Inspeção e classificação",[
  ["Critério de inspeção visível no posto","O padrão (bom, reparo, sucata) com fotos de exemplo fica afixado onde o inspetor trabalha."],
  ["Amostra de 10 paletes classificados certo","Pegue 10 paletes da pilha de bons e confira: tábua rachada, prego saliente, bloco solto ou contaminação reprovam."],
  ["Palete contaminado isolado","Óleo, química ou mofo vai para área de quarentena com descarte ou limpeza registrados."],
  ["Taxa de reparo acompanhada","O centro sabe dizer o percentual de bons, reparo e sucata da última semana."]]],
 ["Reparo e tratamento térmico",[
  ["Reparo dentro do padrão do pool","Peça de reposição na mesma medida e espessura, pregação no padrão e marca da cor do pool refeita."],
  ["Tratamento térmico com registro","Cada lote HT tem registro de tempo e temperatura conforme ISPM-15 e marcação IPPC legível no palete."],
  ["Madeira de reposição rastreável","Lote de madeira com origem identificada (fornecedor homologado, reflorestamento)."],
  ["Fila de reparo sob controle","Paletes aguardando reparo em quantidade compatível com a capacidade de 1 a 2 dias."]]],
 ["Estoque e inventário",[
  ["Contagem física bate com o sistema","Conte uma área e compare com o saldo do sistema. Aceitável até 1% de diferença no próprio centro."],
  ["Inventário cíclico em dia","Veja a data da última contagem completa e do último cíclico. Calendário atrasado é não conformidade."],
  ["Estoque separado por status","Bons, reparo, sucata e terceiros em áreas demarcadas e identificadas."],
  ["Cobertura de estoque para abastecimento","Paletes bons disponíveis cobrem a demanda prevista dos próximos dias de entrega."]]],
 ["Expedição e abastecimento",[
  ["Pedido de abastecimento conferido na carga","Quantidade carregada igual à ordem, com conferência registrada antes de o caminhão sair."],
  ["Veículo vistoriado","Baú limpo, seco e sem pregos expostos antes de carregar."],
  ["Documentos emitidos corretamente","Nota e ordem com cliente, quantidade e tipo de palete batendo."],
  ["Coletas da semana no prazo","Compare as coletas agendadas com as realizadas. Coleta atrasada sem justificativa é não conformidade."]]],
 ["Organização e 5S",[
  ["Pátio limpo e sem sucata espalhada","Sem pedaço de madeira, prego ou cinta no chão das áreas de circulação."],
  ["Ferramentas no lugar","Pregadeiras, serras e compressor guardados e com manutenção identificada."],
  ["Gestão à vista atualizada","Quadro com indicadores da semana e plano de ação da última visita."]]],
 ["Gestão e indicadores",[
  ["Plano de ação da visita anterior concluído","Abra as ações da última visita e verifique cada uma no local."],
  ["Indicadores do mês apresentados","Giro do pool, perdas, tempo de triagem, taxa de reparo e coletas no prazo."],
  ["Equipe treinada no padrão","Pergunte a 2 pessoas qual o critério de reprovação de um palete. As respostas têm de bater com o padrão."]]]];
const TV={id:"tv",nome:"Visita a centro de serviço",visita:1,itens:ROTEIRO.flatMap(([sec,it],k)=>it.map(([txt,como],j)=>({id:"v"+k+"-"+j,txt,tipo:"sn",sec,como})))};
const MAN_INTRO="Para cada item: o que olhar e quando marcar não conforme. Uma visita completa leva de 2 a 3 horas. Comece pela segurança, siga o fluxo do palete (recebimento, inspeção, reparo, estoque, expedição) e feche com a gestão do centro.";
const SEED={templates:[TV,
 {id:"t1",nome:"Abertura do hub",ex:1,itens:[
  {id:"a",txt:"Docas livres e sinalizadas",tipo:"sn"},{id:"b",txt:"Empilhadeira com checklist do turno",tipo:"sn"},
  {id:"c",txt:"Temperatura da área de stage (°C)",tipo:"num"},{id:"d",txt:"Corredores sem material solto",tipo:"sn"},{id:"e",txt:"Foto da expedição",tipo:"foto"}]},
 {id:"t2",nome:"Vistoria de veículo",ex:1,itens:[
  {id:"a",txt:"Pneus e estepe em bom estado",tipo:"sn"},{id:"b",txt:"Baú limpo e sem infiltração",tipo:"sn"},
  {id:"c",txt:"Placa",tipo:"txt"},{id:"d",txt:"Foto do baú",tipo:"foto"}]}],
 pool:{locais:[
  {id:"l1",nome:"CD Cajamar (próprio)",tipo:"CD"},{id:"l2",nome:"Atacado Norte · Guarulhos",tipo:"Cliente"},{id:"l3",nome:"Supermercado Bom Preço",tipo:"Cliente"},
  {id:"l4",nome:"Transportadora Rota Sul",tipo:"Transportador"},{id:"l5",nome:"Base de reparo Osasco",tipo:"Reparo"}],
 movs:[["l1","envio",1200,30],["l2","envio",420,20],["l2","retorno",180,8],["l3","envio",260,25],["l3","retorno",40,5],["l4","envio",150,12],["l4","retorno",90,3],["l5","envio",80,15],["l5","retorno",60,2],["l2","perda",12,6]].map(([local,tipo,qtd,d],i)=>({id:"m"+i,local,tipo,qtd,ts:Date.now()-d*864e5,...(tipo==="retorno"?{insp:{bom:Math.round(qtd*.82),rep:Math.round(qtd*.13),suc:qtd-Math.round(qtd*.82)-Math.round(qtd*.13)}}:{})})),
 coletas:[{id:"k1",local:"l2",qtd:150,data:new Date(Date.now()+2*864e5).toISOString().slice(0,10),ok:false},{id:"k2",local:"l3",qtd:120,data:new Date(Date.now()+5*864e5).toISOString().slice(0,10),ok:false}],
 contagens:[{id:"c1",local:"l1",qtd:1195,ts:Date.now()-3*864e5},{id:"c2",local:"l2",qtd:205,ts:Date.now()-40*864e5},{id:"c3",local:"l3",qtd:221,ts:Date.now()-9*864e5},{id:"c4",local:"l4",qtd:58,ts:Date.now()-2*864e5}]},
 execs:[
 {id:"e1",tpl:"t1",nome:"Abertura do hub",autor:"Exemplo",ts:Date.now()-864e5,ex:1,resp:{a:{v:"c"},b:{v:"nc",obs:"Checklist do turno não preenchido"},c:{v:"22"},d:{v:"c"}},acoes:[{id:"x1",txt:"Checklist do turno não preenchido",dono:"Líder do turno",feito:false}]},
 {id:"e2",tpl:"t2",nome:"Vistoria de veículo",autor:"Exemplo",ts:Date.now()-2*864e5,ex:1,resp:{a:{v:"c"},b:{v:"c"},c:{v:"ABC1D23"}},acoes:[]}]};
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=structuredClone(SEED);if(!S.pool)S.pool=structuredClone(SEED.pool);if(!S.pool.coletas)S.pool.coletas=structuredClone(SEED.pool.coletas);if(!S.templates.some(t=>t.id==="tv"))S.templates.unshift(structuredClone(TV));
let sampleP=null;setTimeout(()=>{try{sampleP=window.claude?.use?window.claude.use("sample"):Promise.resolve(null)}catch(e){sampleP=Promise.resolve(null)}},0);let iaOut=null,iaBusy=false;
let avisou=0;const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){if(!avisou){avisou=1;alert("Sem espaço no aparelho para salvar. Gere o PDF dos relatórios antigos e use Exemplos para limpar.")}}};
const F=new Map();let idb=null;
function idbOpen(){return new Promise(ok=>{try{const q=indexedDB.open("rota-fotos",1);q.onupgradeneeded=()=>q.result.createObjectStore("f");
 q.onsuccess=()=>{idb=q.result;try{const c=idb.transaction("f").objectStore("f").openCursor();c.onsuccess=()=>{const r=c.result;if(r){F.set(r.key,r.value);r.continue()}else ok()};c.onerror=()=>ok()}catch(e){ok()}};q.onerror=()=>ok()}catch(e){ok()}})}
function putFoto(url){if(!idb)return url;const k="f:"+uid();F.set(k,url);try{idb.transaction("f","readwrite").objectStore("f").put(url,k)}catch(e){return url}return k}
const foto=v=>v?(String(v).startsWith("f:")?F.get(v):v):null;
const fd=d=>d?String(d).split("-").reverse().join("/"):"";
let tab="pal",cur=null,edit=null,rel=null,man=null;if(S.cur){cur=S.cur;tab="run"}

function score(x){const t=S.templates.find(t=>t.id===x.tpl);const sn=(t?t.itens:[]).filter(i=>i.tipo==="sn");
 const v=sn.map(i=>x.resp[i.id]?.v).filter(v=>v==="c"||v==="nc");return v.length?Math.round(100*v.filter(x=>x==="c").length/v.length):null}
const dt=ts=>new Date(ts).toLocaleString("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});

function go(t){tab=t;cur=null;edit=null;rel=null;man=null;render();scrollTo(0,0)}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>go(b.dataset.t));

function render(){
 document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.t===tab));
 const a=$("#app");
 if(cur)return runView(a);
 if(rel)return relView(a);
 if(man)return manView(a);
 if(edit)return editView(a);
 const head=`<header><div><div class="eb">Gestão de pool de paletes</div><h1>Rota Paletes</h1></div><button id="reset" title="Volta aos dados de exemplo">Exemplos</button></header>`;
 if(tab==="run"){
  const sc=S.cur;
  a.innerHTML=head+(sc?`<div class="card tpl al"><div style="min-width:0"><div class="eb">Em andamento</div><h2>${esc(sc.nome)}</h2><div class="meta">${sc.local?esc(sc.local)+" · ":""}${Object.values(sc.resp).filter(r=>r.v).length} itens respondidos</div></div><div class="row"><button id="desc">Descartar</button><button class="pri" id="cont">Continuar</button></div></div>`:"")+
  `<div class="eb">Escolha um roteiro para começar</div>`+S.templates.map(t=>`<div class="card tpl"><div style="min-width:0"><h2>${esc(t.nome)}</h2><div class="meta">${t.itens.length} itens${t.visita?" · manual, fotos e relatório em PDF":""} ${t.ex?'<span class="ex">EXEMPLO</span>':""}</div></div><div class="row">${t.itens.some(i=>i.como)?`<button data-man="${t.id}">Manual</button>`:""}<button class="pri" data-run="${t.id}">Iniciar</button></div></div>`).join("");
  a.querySelectorAll("[data-run]").forEach(b=>b.onclick=()=>{const t=S.templates.find(x=>x.id===b.dataset.run);cur={id:uid(),tpl:t.id,nome:t.nome,autor:S.visitante||"",local:"",ts:Date.now(),resp:{},acoes:[]};S.cur=cur;save();render();scrollTo(0,0)});
  a.querySelectorAll("[data-man]").forEach(b=>b.onclick=()=>{man=b.dataset.man;render();scrollTo(0,0)});
  if(sc){$("#cont").onclick=()=>{cur=S.cur;render();scrollTo(0,0)};$("#desc").onclick=()=>{const d=$("#desc");if(!d.dataset.c){d.dataset.c=1;d.textContent="Confirmar";return}delete S.cur;save();render()}}
 }
 if(tab==="tpl"){
  a.innerHTML=head+`<button class="pri" id="novo">Novo modelo</button>`+S.templates.map(t=>`<div class="card tpl"><div style="min-width:0"><h2>${esc(t.nome)}</h2><div class="meta">${t.itens.map(i=>esc(i.txt)).slice(0,3).join(" · ")}${t.itens.length>3?" …":""}</div></div><button data-ed="${t.id}">Editar</button></div>`).join("");
  $("#novo").onclick=()=>{edit={id:uid(),nome:"",itens:[{id:uid(),txt:"",tipo:"sn"}]};render()};
  a.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{edit=structuredClone(S.templates.find(x=>x.id===b.dataset.ed));render()});
 }
 if(tab==="rep"){
  const ex=S.execs,sc=ex.map(score).filter(v=>v!=null),med=sc.length?Math.round(sc.reduce((a,b)=>a+b)/sc.length):0;
  const ab=ex.flatMap(e=>e.acoes.map(x=>({...x,e}))).filter(x=>!x.feito);
  a.innerHTML=head+`<div class="kpis"><div class="card kpi"><span class="eb">Execuções</span><b class="num">${ex.length}</b></div><div class="card kpi"><span class="eb">Conformidade</span><b>${med}%</b></div><div class="card kpi"><span class="eb">Ações abertas</span><b class="${ab.length?"bad":"ok"}">${ab.length}</b></div></div>
  <div class="card"><h2>Plano de ação</h2>${ab.length?ab.map(x=>`<label class="row"><input type="checkbox" id="ac-${x.id}" data-ac="${x.id}" style="width:auto"><span class="sp" style="min-width:0"><b>${esc(x.txt)}</b><br><span class="meta">${esc(x.dono||"Sem responsável")}${x.prazo?" · até "+fd(x.prazo):""} · ${esc(x.e.local||x.e.nome)} · ${dt(x.e.ts)}</span></span></label>`).join(""):`<p class="empty">Nenhuma não conformidade em aberto.</p>`}</div>
  <div class="eb">Histórico</div>`+(ex.length?ex.slice().sort((a,b)=>b.ts-a.ts).map(e=>{const s=score(e);return `<div class="card"><div class="tpl"><div style="min-width:0"><h2>${esc(e.nome)}</h2><div class="meta">${e.local?esc(e.local)+" · ":""}${esc(e.autor)} · ${dt(e.ts)} ${e.ex?'<span class="ex">EXEMPLO</span>':""}</div></div><div class="row"><span class="pill ${s>=85?"ok":"bad"}">${s==null?"—":s+"%"}</span><button data-rel="${e.id}">Relatório</button></div></div><div class="bar"><i style="width:${s||0}%"></i></div></div>`}).join(""):`<p class="empty">Nenhum checklist executado ainda.</p>`);

const CICLO={CD:7,Cliente:30,Transportador:15,Reparo:30};
function poolCalc(){const P=S.pool;return P.locais.map(l=>{
 const mv=P.movs.filter(m=>m.local===l.id);const saldo=mv.reduce((a,m)=>a+(m.tipo==="envio"?m.qtd:-m.qtd),0);
 const perdas=mv.filter(m=>m.tipo==="perda").reduce((a,m)=>a+m.qtd,0);
 const c=P.contagens.filter(x=>x.local===l.id).sort((a,b)=>b.ts-a.ts)[0];
 const saldoNaContagem=c?mv.filter(m=>m.ts<=c.ts).reduce((a,m)=>a+(m.tipo==="envio"?m.qtd:-m.qtd),0):null;
 const div=c?c.qtd-saldoNaContagem:null;const divPct=c&&saldoNaContagem?Math.round(1000*div/saldoNaContagem)/10:null;
 const dias=c?Math.floor((Date.now()-c.ts)/864e5):null;const ciclo=CICLO[l.tipo]||30;
 const prio=Math.round((saldo/50)+(Math.abs(divPct||0)*2)+(dias==null?40:Math.max(0,dias-ciclo)));
 return{...l,saldo,perdas,ult:c,div,divPct,dias,ciclo,vencida:dias==null||dias>ciclo,prio}}).sort((a,b)=>b.prio-a.prio)}

 <div class="card"><h2>Plano de ação</h2>${x.acoes.length?`<table class="tb"><tr><th>Item</th><th>O que corrigir</th><th>Responsável</th><th>Prazo</th></tr>${x.acoes.map(c=>`<tr><td>${esc(c.item||c.txt)}</td><td>${esc(c.txt)}</td><td>${esc(c.dono||"—")}</td><td>${c.prazo?fd(c.prazo):"—"}${c.feito?' <span class="pill ok">feito</span>':""}</td></tr>`).join("")}</table>`:`<p class="meta">Nenhuma não conformidade.</p>`}</div>
 ${G.map(g=>`<div class="card"><h2>${esc(g.sec||"Detalhe")}</h2>${g.itens.map(i=>{const r=x.resp[i.id]||{},s=ST[r.v];
  const val=i.tipo==="sn"?(s?`<span class="pill ${s[1]}">${s[0]}</span>`:`<span class="meta">Não avaliado</span>`):i.tipo==="foto"?"":`<span class="num">${esc(r.v||"—")}</span>`;const u=foto(i.tipo==="foto"?r.v:r.foto);
  return `<div class="item"><div class="row"><b class="sp">${esc(i.txt)}</b>${val}</div>${r.v==="nc"&&r.obs?`<div class="meta">${esc(r.obs)}</div>`:""}${u?`<img class="rf" src="${u}" alt="Foto: ${esc(i.txt)}">`:""}</div>`}).join("")}</div>`).join("")}
 ${x.obs?`<div class="card"><h2>Observações gerais</h2><p style="margin:0">${esc(x.obs)}</p></div>`:""}`;
 $("#sair").onclick=()=>{rel=null;render();scrollTo(0,0)};
 $("#pdf").onclick=()=>imprimir(`Relatório ${x.nome} ${x.local||""} ${dia}`.replace(/\s+/g," ").trim());
 const resumo=`${x.nome}${x.local?" · "+x.local:""} · ${dia}\nNota geral: ${n.nota==null?"-":n.nota+"%"} · ${n.nc} não conformidades`+(x.acoes.length?"\n\nPlano de ação:\n"+x.acoes.map(c=>`- ${c.txt}${c.dono?" ("+c.dono+")":""}${c.prazo?" até "+fd(c.prazo):""}`).join("\n"):"");
 $("#shr").onclick=async()=>{const b=$("#shr");try{if(navigator.share){await navigator.share({title:x.nome,text:resumo});return}}catch(e){if(e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(resumo);b.textContent="Resumo copiado"}catch(e){location.href="mailto:?subject="+encodeURIComponent(x.nome)+"&body="+encodeURIComponent(resumo)}};
}

function manView(a){
 const t=S.templates.find(x=>x.id===man);if(!t){man=null;return render()}
 a.innerHTML=`<header><div><div class="eb">Manual</div><h1>${esc(t.nome)}</h1></div><button id="sair" class="np">Voltar</button></header>${t.visita?`<div class="card"><p class="meta" style="margin:0">${MAN_INTRO}</p></div>`:""}`+
 grupos(t).map(g=>`<div class="card">${g.sec?`<h2>${esc(g.sec)}</h2>`:""}${g.itens.map(i=>`<div class="item"><b>${esc(i.txt)}</b>${i.como?`<div class="meta">${esc(i.como)}</div>`:""}</div>`).join("")}</div>`).join("")+
 `<button class="np" id="pm">Salvar manual em PDF</button>`;
 $("#sair").onclick=()=>{man=null;render();scrollTo(0,0)};$("#pm").onclick=()=>imprimir("Manual "+t.nome);
}

function editView(a){
 a.innerHTML=`<header><div><div class="eb">Construtor</div><h1>${edit.nome?esc(edit.nome):"Novo modelo"}</h1></div><button id="sair">Cancelar</button></header>
 <div class="card"><label class="eb" for="ed-nome">Nome do checklist</label><input id="ed-nome" value="${esc(edit.nome)}" placeholder="Ex.: Fechamento do turno"></div>
 <div class="card"><div class="eb">Itens</div>${edit.itens.map((i,k)=>`<div class="ed"><input id="it-${i.id}" data-k="${k}" value="${esc(i.txt)}" placeholder="Pergunta"><select id="ty-${i.id}" data-s="${k}">${[["sn","Sim/Não"],["num","Número"],["txt","Texto"],["foto","Foto"]].map(([v,l])=>`<option value="${v}" ${i.tipo===v?"selected":""}>${l}</option>`).join("")}</select><button data-x="${k}" aria-label="Remover item">×</button></div>`).join("")}
 <button id="add">Adicionar item</button></div>
 <div class="row"><button class="pri sp" id="salvar">Salvar modelo</button>${S.templates.some(t=>t.id===edit.id)?`<button id="del">Excluir</button>`:""}</div>`;
 $("#sair").onclick=()=>go("tpl");
 $("#ed-nome").oninput=e=>edit.nome=e.target.value;
 a.querySelectorAll("[data-k]").forEach(x=>x.oninput=()=>edit.itens[x.dataset.k].txt=x.value);
 a.querySelectorAll("[data-s]").forEach(x=>x.onchange=()=>edit.itens[x.dataset.s].tipo=x.value);
 a.querySelectorAll("[data-x]").forEach(x=>x.onclick=()=>{edit.itens.splice(x.dataset.x,1);render()});
 $("#add").onclick=()=>{edit.itens.push({id:uid(),txt:"",tipo:"sn"});render()};
 $("#salvar").onclick=()=>{edit.itens=edit.itens.filter(i=>i.txt.trim());if(!edit.nome.trim()||!edit.itens.length){$("#salvar").textContent="Dê um nome e ao menos 1 item";return}
  delete edit.ex;const k=S.templates.findIndex(t=>t.id===edit.id);if(k>=0)S.templates[k]=edit;else S.templates.push(edit);save();go("tpl")};
 const d=$("#del");if(d)d.onclick=()=>{if(!d.dataset.c){d.dataset.c=1;d.textContent="Confirmar";return}S.templates=S.templates.filter(t=>t.id!==edit.id);save();go("tpl")};
}
idbOpen().then(render);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});navigator.serviceWorker?.addEventListener("controllerchange",()=>{if(!window.__rl){window.__rl=1;location.reload()}});
</script>
